<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f4f7f4;--fg:#1b3a1e;--card:#fff;--ln:#43a047;--mut:#5f7a62;--bd:#cfd8cf;--btn:#2e7d32;--btnt:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121a13;--fg:#e3f1e4;--card:#1c261d;--mut:#9bb59d;--bd:#34443a;--btn:#4caf50;--btnt:#0d1a0e}}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.35 Arial,Helvetica,sans-serif;-webkit-tap-highlight-color:transparent}

h1{font-size:17px;margin:0 auto 0 0}
button,select,input{font:inherit}
.b{background:var(--btn);color:var(--btnt);border:0;border-radius:8px;padding:8px 12px;cursor:pointer}
.b.ol{background:transparent;color:var(--fg);border:1px solid var(--bd)}
.b.d{background:#c62828;color:#fff}
#wrap{overflow-x:auto;padding:16px 12px 60px}
.tree ul{display:flex;justify-content:center;margin:0;padding:22px 0 0;list-style:none;position:relative}
.tree ul ul::before{content:"";position:absolute;top:0;left:50%;border-left:2px solid var(--ln);height:22px}
.tree li{position:relative;display:flex;flex-direction:column;align-items:center;padding:22px 6px 0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:22px;border-top:2px solid var(--ln)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--ln)}
.tree li:only-child{padding-top:0}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--ln);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree>ul{padding-top:0;width:max-content;margin:0 auto}
.tree>ul>li{padding-top:0}.tree>ul>li::before,.tree>ul>li::after{display:none}
.nd{position:relative;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:bold;cursor:pointer;border:3px solid #43a047;background:#43a047;color:#fff;box-sizing:border-box;user-select:none;-webkit-user-select:none}
.nd.y{border-color:#f9a825}.nd.p{border-color:#e91e63}.nd.sel{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg)}
.nd[data-s]::after{content:attr(data-s);position:absolute;top:-7px;right:-7px;width:16px;height:16px;line-height:14px;text-align:center;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--fg);font-size:9px;font-weight:bold}
#info{padding:10px 12px;border-bottom:1px solid var(--bd);font-size:13px}
#info .hint{color:var(--mut)}#info b{font-size:15px}
#info .bc span{cursor:pointer;color:var(--btn);font-weight:bold}
#info .bt{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#info .bt button{border:1px solid var(--bd);background:transparent;color:var(--fg);border-radius:8px;padding:8px 10px;cursor:pointer}
#info .bt button.pr{background:var(--btn);color:var(--btnt);border:0}
#info div{margin:2px 0}
#m{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#m.on{display:flex}
#f{background:var(--card);border-radius:12px;padding:16px;width:min(420px,100%);max-height:90%;overflow:auto}
#f h2{margin:0 0 10px;font-size:16px}
#f label{display:block;margin:7px 0 2px;font-size:12px;color:var(--mut)}
#f input,#f select{width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--fg);font-size:16px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.act{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;flex-wrap:wrap}
#t{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:8px 14px;border-radius:8px;display:none;z-index:30;max-width:90vw;text-align:center}
</style></head><body>

const KEY="tree_app_v1";
let N=[];
function load(){let a=null;try{const s=localStorage.getItem(KEY);if(s){const x=JSON.parse(s);if(Array.isArray(x)&&x.length)a=x}}catch(e){}
const mk=()=>{try{localStorage.setItem(KEY+"_m","2")}catch(e){}};
if(!a){N=JSON.parse(JSON.stringify(SEED));mk();save();return}
let f=null;try{f=localStorage.getItem(KEY+"_m")}catch(e){}
if(f!=="2"){const have=new Set(a.map(x=>x.id));SEED.forEach(s=>{if(s.id>=1000&&!have.has(s.id))a.push(JSON.parse(JSON.stringify(s)))});mk();N=a;save();setTimeout(()=>toast("Добавлены новые узлы"),300);return}
N=a}
function save(){let ok=false;try{localStorage.setItem(KEY,JSON.stringify(N));ok=true}catch(e){}
const s=document.getElementById("st");if(s){const t=new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"});s.textContent=ok?"Сохранено "+t:"Не сохраняется";}return ok}
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const kids=id=>N.filter(n=>n.p===id).sort((a,b)=>(a.s==="П")-(b.s==="П"));
const fmt=v=>{if(v===""||v==null)return "—";const x=Number(v);return isNaN(x)?v:x.toLocaleString("ru-RU",{maximumFractionDigits:1})};
function depth(n){let d=0;while(n.p!=null){n=N.find(x=>x.id===n.p);if(!n)break;d++}return d}
const autoIni=nm=>{const w=nm.split(/\s+/).filter(Boolean);return (w.length>1?w[1][0]+w[0][0]:(w[0]||"?").slice(0,2)).toUpperCase()};
let cur=null;
function circ(n,deep){const k=deep?kids(n.id):[];return `<li><div class="nd ${n.c||"g"}${n.id===cur?" sel":""}" data-e="${n.id}"${n.s?` data-s="${n.s}"`:""} title="${esc(n.nm)}">${esc(n.ini||"?")}</div>${k.length?"<ul>"+k.map(c=>circ(c,true)).join("")+"</ul>":""}</li>`}
function cnt(id){return kids(id).reduce((s,c)=>s+1+cnt(c.id),0)}
function chain(n){const a=[];while(n){a.unshift(n);n=N.find(x=>x.id===n.p)}return a}
function render(){if(cur!=null&&!N.find(x=>x.id===cur))cur=null;
const r=cur==null?N.filter(n=>n.p==null):[N.find(x=>x.id===cur)];

if(!n){I.innerHTML='<div class="hint">Нажмите на ячейку, чтобы увидеть её структуру.</div>';return}

I.innerHTML=`<div class="bc">${chain(n).map(x=>`<span data-e="${x.id}">${esc(x.ini||"?")}</span>`).join(" › ")}</div>

function form(n,isNew){

/* Сохранение файлов: на телефоне — меню «Поделиться» (Сохранить в Файлы), иначе обычное скачивание */
async function dl(name,data,mime){
const blob=data instanceof Blob?data:new Blob([data],{type:mime||"application/octet-stream"});
try{if(matchMedia("(pointer:coarse)").matches&&navigator.canShare){const f=new File([blob],name,{type:blob.type});
if(navigator.canShare({files:[f]})){await navigator.share({files:[f]});toast("Готово");return}}}
catch(e){if(e&&e.name==="AbortError"){toast("Отменено");return}}
try{const u=URL.createObjectURL(blob),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
setTimeout(()=>URL.revokeObjectURL(u),5000);toast("Файл сохранён: "+name)}catch(e){toast("Не удалось сохранить файл")}}
$("exJ").onclick=()=>dl("tree.json",JSON.stringify(N,null,1),"application/json");
$("exC").onclick=()=>{const h=["№","Инициалы","Уровень","Код сверху (спонсор)","ФИО","ID","Родитель (№)","Сторона","Левое число","Правое число","Цвет"];
const cn={g:"зелёная",y:"жёлтая",p:"розовая"};const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
const rows=N.map(n=>[n.id,n.ini,depth(n),n.sp,n.nm,n.pid,n.p==null?"":n.p,n.s,n.l,n.r,cn[n.c]||""].map(q).join(";"));
dl("tree.csv","﻿"+[h.map(q).join(";"),...rows].join("\r\n"),"text/csv;charset=utf-8")};

/* Импорт с проверкой структуры */
function validate(a){
if(!Array.isArray(a)||!a.length)throw new Error("файл пуст или это не список узлов");
const ids=new Set(),sides=new Set();
a.forEach(x=>{if(!x||typeof x!=="object"||typeof x.id!=="number"||!isFinite(x.id))throw new Error("у узла нет числового id");
if(ids.has(x.id))throw new Error("повторяется №"+x.id);ids.add(x.id)});
a.forEach(x=>{if(x.p==null)return;if(!ids.has(x.p))throw new Error("у узла №"+x.id+" нет родителя №"+x.p);
const k=x.p+"|"+(x.s==="П"?"П":"Л");if(sides.has(k))throw new Error("у узла №"+x.p+" два потомка на одной стороне");sides.add(k)});
const par=new Map(a.map(x=>[x.id,x.p==null?null:x.p]));
for(const x of a){let c=x.id,s=0;while(par.get(c)!=null){c=par.get(c);if(++s>a.length)throw new Error("в структуре есть цикл")}}
const t=v=>v==null?"":v;
return a.map(x=>({id:x.id,p:x.p==null?null:x.p,s:x.p==null?"":(x.s==="П"?"П":"Л"),ini:String(t(x.ini)),sp:String(t(x.sp)),nm:String(t(x.nm)),pid:String(t(x.pid)),l:t(x.l),r:t(x.r),c:["g","y","p"].includes(x.c)?x.c:"g"}))}

r.onload=()=>{try{const a=validate(JSON.parse(r.result));if(!confirm("Заменить текущие данные импортированными ("+a.length+" узл.)?"))return;N=a;cur=null;save();render();toast("Импортировано: "+a.length)}catch(x){toast("Неверный файл: "+(x&&x.message||"ошибка"))}};
r.onerror=()=>toast("Не удалось прочитать файл");r.readAsText(f);e.target.value=""};

/* Минимальный PDF-writer: одна страница с JPEG — работает без интернета и без библиотек */
function makePdf(jpg,w,h,pw,ph){
const enc=new TextEncoder(),parts=[],off=[];let len=0;
const add=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);len+=b.length};
const obj=(n,s)=>{off[n]=len;add(n+" 0 obj\n"+s+"\nendobj\n")};
add("%PDF-1.4\n");
obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
obj(2,"<< /Type /Pages /Kids [3 0 R] /Count 1 >>");
obj(3,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+pw+" "+ph+"] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>");
off[4]=len;add("4 0 obj\n<< /Type /XObject /Subtype /Image /Width "+w+" /Height "+h+" /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length "+jpg.length+" >>\nstream\n");add(jpg);add("\nendstream\nendobj\n");
const cs="q "+pw+" 0 0 "+ph+" 0 0 cm /Im0 Do Q";
obj(5,"<< /Length "+cs.length+" >>\nstream\n"+cs+"\nendstream");
const xr=len;let t="xref\n0 6\n0000000000 65535 f \n";
for(let i=1;i<=5;i++)t+=String(off[i]).padStart(10,"0")+" 00000 n \n";
add(t+"trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF\n");
return new Blob(parts,{type:"application/pdf"})}
async function pdf(id){const root=N.find(x=>x.id===id);if(!root){toast("Нет данных");return}
const lv={},pos={};let leaf=0;
const lay=(n,d)=>{lv[n.id]=d;const k=kids(n.id);if(!k.length)pos[n.id]=leaf++;else{k.forEach(c=>lay(c,d+1));pos[n.id]=(pos[k[0].id]+pos[k[k.length-1].id])/2}};
lay(root,0);
const CW=132,CH=70,GX=146,GY=112,M=30,T=60,md=Math.max(...Object.values(lv));
const W=Math.max(Math.round(leaf*GX+2*M),420),H=(md+1)*GY+T+M;
const s=Math.min(2,8000/Math.max(W,H),Math.sqrt(12e6/(W*H)));
const cv=document.createElement("canvas");cv.width=Math.round(W*s);cv.height=Math.round(H*s);
const x=cv.getContext("2d");x.scale(s,s);x.fillStyle="#fff";x.fillRect(0,0,W,H);
const cx=n=>M+GX/2+pos[n.id]*GX,tp=n=>T+lv[n.id]*GY;
const all=[];const col=n=>{all.push(n);kids(n.id).forEach(col)};col(root);
x.fillStyle="#2e7d32";x.font="bold 16px Arial";x.textAlign="left";x.fillText("Структура: "+(root.nm||root.ini)+" ("+all.length+" узл.)",M,30);
x.strokeStyle="#43a047";x.lineWidth=1.3;
all.forEach(n=>{const k=kids(n.id);if(!k.length)return;const pb=tp(n)+CH,my=pb+(GY-CH)/2,xs=k.map(cx).concat([cx(n)]);
x.beginPath();x.moveTo(cx(n),pb);x.lineTo(cx(n),my);x.moveTo(Math.min(...xs),my);x.lineTo(Math.max(...xs),my);k.forEach(c=>{x.moveTo(cx(c),my);x.lineTo(cx(c),tp(c))});x.stroke()});
const F={g:["#c8e6c9","#43a047"],y:["#fff3b0","#f9a825"],p:["#f8bbd0","#e91e63"]};
const rr=(a,b,w,hh,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+hh,r);x.arcTo(a+w,b+hh,a,b+hh,r);x.arcTo(a,b+hh,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()};
x.textAlign="center";
all.forEach(n=>{const c=cx(n),t=tp(n),f=F[n.c||"g"];rr(c-CW/2,t,CW,CH,6);x.fillStyle=f[0];x.fill();x.strokeStyle=f[1];x.lineWidth=n.c==="y"||n.c==="p"?2.4:1;x.stroke();
x.fillStyle="#1b5e20";x.font="9px Arial";x.fillText("["+(n.ini||"?")+"]  ("+(n.sp||"—")+")  ·  Ур. "+depth(n),c,t+12);
x.font="bold 10px Arial";let y=t+25;const w=(n.nm||"").split(/\s+/),ls=[];let cl="";
w.forEach(z=>{if(x.measureText((cl+" "+z).trim()).width>CW-10&&cl){ls.push(cl);cl=z}else cl=(cl+" "+z).trim()});ls.push(cl);
ls.slice(0,3).forEach(l=>{x.fillText(l,c,y);y+=11});
x.fillText("("+(n.pid||"—")+")",c,y);
x.font="10px Arial";x.fillText(fmt(n.l)+"  |  "+fmt(n.r),c,t+CH-6)});
try{toast("Готовлю PDF…");
const jb=await new Promise((ok,no)=>cv.toBlob(b=>b?ok(b):no(new Error("canvas")),"image/jpeg",0.92));
const jpg=new Uint8Array(await jb.arrayBuffer());
const k=Math.min(1,14400/Math.max(W,H));
const blob=makePdf(jpg,cv.width,cv.height,Math.round(W*k),Math.round(H*k));
await dl("tree_"+(root.ini||"x")+".pdf",blob,"application/pdf")}catch(e){toast("Не удалось создать PDF")}}
